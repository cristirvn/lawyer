<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-label="Balanța justiției">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2a4d"/>
      <stop offset="0.55" stop-color="#131d3c"/>
      <stop offset="1" stop-color="#0d1530"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2c98f"/>
      <stop offset="0.5" stop-color="#c3a15b"/>
      <stop offset="1" stop-color="#9a7a38"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#c3a15b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c3a15b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3a63"/>
      <stop offset="1" stop-color="#141f3e"/>
    </linearGradient>
  </defs>

  <rect width="640" height="760" fill="url(#bg)"/>
  <rect width="640" height="760" fill="url(#glow)"/>

  <!-- faint laurel arcs -->
  <g stroke="#c3a15b" stroke-opacity="0.14" fill="none" stroke-width="1.5">
    <circle cx="320" cy="330" r="235"/>
    <circle cx="320" cy="330" r="262"/>
  </g>

  <!-- scales -->
  <g stroke="url(#gold)" stroke-width="7" fill="none" stroke-linecap="round">
    <!-- column -->
    <line x1="320" y1="150" x2="320" y2="560"/>
    <!-- beam -->
    <line x1="150" y1="215" x2="490" y2="215"/>
    <!-- hangers -->
    <line x1="150" y1="220" x2="112" y2="330"/>
    <line x1="150" y1="220" x2="188" y2="330"/>
    <line x1="490" y1="220" x2="452" y2="330"/>
    <line x1="490" y1="220" x2="528" y2="330"/>
  </g>

  <!-- finial -->
  <circle cx="320" cy="140" r="14" fill="url(#gold)"/>
  <circle cx="320" cy="215" r="9" fill="url(#gold)"/>

  <!-- pans -->
  <g fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round">
    <path d="M104 332 A 48 40 0 0 0 196 332"/>
    <path d="M444 332 A 48 40 0 0 0 536 332"/>
  </g>
  <ellipse cx="150" cy="330" rx="46" ry="7" fill="#c3a15b" opacity="0.5"/>
  <ellipse cx="490" cy="330" rx="46" ry="7" fill="#c3a15b" opacity="0.5"/>

  <!-- base -->
  <g fill="url(#gold)">
    <rect x="252" y="556" width="136" height="16" rx="4"/>
    <rect x="230" y="580" width="180" height="20" rx="5"/>
  </g>
  <rect x="204" y="608" width="232" height="34" rx="6" fill="url(#marble)" stroke="#c3a15b" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- caption line -->
  <g fill="#e8dcc2" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="320" y="694" font-size="21" letter-spacing="7" opacity="0.9">FIAT JUSTITIA</text>
    <text x="320" y="722" font-size="12" letter-spacing="4" opacity="0.55">BAROUL BUCUREȘTI · DIN 1999</text>
  </g>
</svg>
