# Cabinet de Avocat Lixandru Elena — configurație nginx pentru VPS
#
# Instalare:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/avocatlixandruelena
#   sudo ln -s /etc/nginx/sites-available/avocatlixandruelena /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (după ce DNS-ul pointează spre VPS):
#   sudo certbot --nginx -d avocatlixandruelena.ro -d www.avocatlixandruelena.ro
# Certbot adaugă singur blocul de redirect 80 -> 443 și liniile ssl_*.

server {
    listen 80;
    listen [::]:80;
    server_name avocatlixandruelena.ro www.avocatlixandruelena.ro;

    root /var/www/avocatlixandruelena;
    index index.html;

    charset utf-8;

    # --- Antete de securitate (echivalentul vercel.json) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Strict-Transport-Security se activează DOAR după ce HTTPS funcționează:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # --- Compresie ---
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript image/svg+xml;

    # --- HTML: fără cache învechit, actualizările apar imediat ---
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --- Resurse statice: cache scurt, tot cu revalidare ---
    location ~* ^/(css|js|img)/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /index.html;
}
